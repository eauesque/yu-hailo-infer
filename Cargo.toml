[workspace]
members = ["yu-hailo-auth", "yu-hailo-infer-core", "yu-hailo-infer"]
resolver = "2"

[workspace.package]
version    = "0.2.0"
edition    = "2021"
license    = "MIT"
repository = "https://github.com/eauesque/yu-hailo-infer"
authors    = ["eauesque"]

[workspace.dependencies]
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tokio              = { version = "1", features = ["full"] }
thiserror          = "2"
image              = "0.25"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap               = { version = "4", features = ["derive", "env"] }
axum               = { version = "0.8", features = ["macros", "multipart"] }
futures-util       = "0.3"
subtle             = "2"
hex                = "0.4"
rand               = { version = "0.9", features = ["os_rng"] }
base64             = "0.22"
