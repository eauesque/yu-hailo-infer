[package]
name = "yu-infer"
version = "0.1.0"
edition = "2021"

[lib]
name = "yu_infer"
path = "src/lib.rs"

[[bin]]
name = "yu-infer"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
auth-core = { path = "../auth-core" }
thiserror = { workspace = true }
infer-core = { path = "../infer-core" }
image = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[build-dependencies]
cc = "1"

[features]
cuda = ["infer-core/cuda"]
rocm = ["infer-core/rocm"]
directml = ["infer-core/directml"]
coreml = ["infer-core/coreml"]
openvino = ["infer-core/openvino"]
