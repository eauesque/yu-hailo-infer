[package]
name        = "yu-hailo-infer"
description = "HTTP inference sidecar for the Hailo-10H NPU: CLIP embeddings, WD-Tagger tagging, YOLO detection, LLM/VLM generation and speech-to-text. Unofficial, not affiliated with Hailo."
keywords    = ["hailo", "npu", "inference", "clip", "yolo"]
categories  = ["computer-vision", "web-programming::http-server"]
# No `readme`: the READMEs live at the workspace root, outside this package.
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
authors.workspace    = true

[lib]
name = "yu_hailo_infer"
path = "src/lib.rs"

[[bin]]
name = "yu-hailo-infer"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
# Aliased to the historical names so the module bodies need no churn.
auth_core = { package = "yu-hailo-auth", version = "0.3.0", path = "../yu-hailo-auth" }
thiserror = { workspace = true }
infer_core = { package = "yu-hailo-infer-core", version = "0.3.0", path = "../yu-hailo-infer-core" }
image = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
hound = "3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[build-dependencies]
cc = "1"

[features]
cuda = ["infer_core/cuda"]
rocm = ["infer_core/rocm"]
directml = ["infer_core/directml"]
coreml = ["infer_core/coreml"]
openvino = ["infer_core/openvino"]
